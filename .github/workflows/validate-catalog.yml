name: Validate catalog

# Manual (workflow_dispatch) only: no Actions minutes on this account. Run the
# same two checks locally before pushing:
#   python3 scripts/validate-catalog.py && python3 scripts/generate-plugin-index.py --check
# scripts/local-bump-runner.sh runs them on main and on every bump branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate catalog
        run: python3 scripts/validate-catalog.py

      - name: Check plugin index is up to date
        run: python3 scripts/generate-plugin-index.py --check
